[project]
name = "webshrink"
version = "0.1.0"
description = "Handler-level system call allowlist generation and enforcement for Go applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipython>=9.8.0",
    "loguru>=0.7.3",
    "orjson>=3.11.4",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "playwright",
]
